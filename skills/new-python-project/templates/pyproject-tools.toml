
[tool.ruff]
# Black-compatible line length. `ruff format` owns line length, so E501 is off below.
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes: unused names, undefined names
    "I",    # isort: import order
    "B",    # flake8-bugbear: common bug risks
    "ARG",  # flake8-unused-arguments
    "N",    # pep8-naming
    "S",    # flake8-bandit: security patterns
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "C90",  # mccabe: cyclomatic complexity, threshold below
    "UP",   # pyupgrade: modern syntax
    "RUF",  # ruff-specific rules
    "PT011",   # pytest.raises on a broad exception needs a match
    "PT014",   # a duplicated parametrize row tests nothing new
    "PLW0129", # an assert on a string literal always passes
    "PLR0124", # a value compared with itself always passes
    "D101", # fails on a public class that has no docstring.
    "D102", # fails on a public method that has no docstring.
    "D103", # fails on a public function that has no docstring.
]
ignore = [
    "E501",  # line length is `ruff format`'s job
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert is how tests assert
    "SIM117",  # nested `with` reads better in test setup
    "S108",    # temporary paths are fine in tests
]
"src/MODULE/__init__.py" = [
    "D103",  # the stub function uv init writes. Remove once real code lives here.
]
"tests/test_MODULE.py" = [
    "D103",  # the smoke test
]

[tool.complexipy]
# Cognitive complexity, which mccabe's cyclomatic count misses.
paths = ["src", "tests"]
max-complexity-allowed = 15
failed = true

[tool.uv]
# The dependency cooldown, for machines without the user-level uv setting.
exclude-newer = "14 days"
