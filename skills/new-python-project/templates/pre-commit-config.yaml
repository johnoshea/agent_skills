# Run by prek on every commit. ruff runs through `uv run`, so the hook uses
# the version in uv.lock. bca is the binary on PATH. Keep in step with the
# justfile.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format --check
        language: system
        entry: uv run ruff format --check
        types_or: [python, pyi]
      - id: bca-check
        name: bca check
        language: system
        entry: bca check
        pass_filenames: false
